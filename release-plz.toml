# Release configuration for the Rust CLI package in crates/prt/.
# release-plz uses git-cliff to update CHANGELOG.md.

[workspace]
git_only = true
publish = false
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
# Keep the release private until checks, artifacts, and notes are ready.
git_release_draft = true
git_release_name = "v{{ version }}"
git_release_body = "{{ changelog }}"
changelog_config = "git-cliff.toml"
release_always = false
dependencies_update = false

[[package]]
name = "prt"
changelog_path = "./CHANGELOG.md"
changelog_update = true
publish = false
git_only = true
git_tag_name = "v{{ version }}"
git_release_enable = true

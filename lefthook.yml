pre-commit:
  commands:
    format:
      glob: "**/*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    analyze:
      run: cd apps/dart && dart analyze

pre-push:
  commands:
    dart-test:
      run: cd apps/dart && dart test
    rust-test:
      run: cargo test --manifest-path apps/rust/Cargo.toml --locked

name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz-release:
    name: Release unpublished version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release
        uses: release-plz/action@a80d79efe0a195618acb02a4089d55fe74d2505f # v0.5.136
        with:
          command: release
          manifest_path: Cargo.toml
          config: release-plz.toml
          version: 0.3.165
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Prepare release PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # release-plz reconstructs the latest git-only release in a worktree.
      # v4.0.11 predates the root Cargo workspace, so provide the workspace
      # files in a local synthetic tag without rewriting the remote tag.
      - name: Bootstrap historical Cargo workspace for release-plz
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest_tag" ]] || git cat-file -e "${latest_tag}^{tree}:Cargo.toml" 2>/dev/null; then
            exit 0
          fi

          tag_ref="$(git rev-parse "$latest_tag")"
          tag_commit="$(git rev-list -n 1 "$latest_tag")"
          temporary_index="$(mktemp)"
          trap 'rm -f "$temporary_index"' EXIT
          rm -f "$temporary_index"

          GIT_INDEX_FILE="$temporary_index" git read-tree "${latest_tag}^{tree}"
          GIT_INDEX_FILE="$temporary_index" git add Cargo.toml Cargo.lock
          bootstrap_tree="$(GIT_INDEX_FILE="$temporary_index" git write-tree)"
          bootstrap_commit="$(git -c user.name='release-plz bootstrap' \
            -c user.email='release-plz-bootstrap@example.invalid' \
            commit-tree "$bootstrap_tree" -p "$tag_commit" \
            -m 'chore(release): bootstrap historical Cargo workspace')"

          git update-ref "refs/tags/$latest_tag" "$bootstrap_commit" "$tag_ref"

      - name: Run release-plz release PR
        uses: release-plz/action@a80d79efe0a195618acb02a4089d55fe74d2505f # v0.5.136
        with:
          command: release-pr
          manifest_path: Cargo.toml
          config: release-plz.toml
          version: 0.3.165
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

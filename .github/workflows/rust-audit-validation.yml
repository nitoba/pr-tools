name: Rust audit validation (temporary)

on:
  push:
    branches: [audit/rust-low-value-validation]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  process-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2eabd586f880808e766b145b6b76d77e05ece868
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Prove retained process assertions on this platform
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os, subprocess
          directory = Path(os.environ['RUNNER_TEMP'])/'process-proof'
          directory.mkdir()
          old = Path('apps/rust/src/process.rs').read_text(encoding='utf-8')
          block = '    #[test]\n    fn keeps_original_command_first() {\n        assert_eq!(\n            command_candidates("codex").first().map(String::as_str),\n            Some("codex")\n        );\n    }\n\n'
          assert old.count(block) == 1
          new = old.replace(block, '')
          data = new.encode('utf-8')
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == 'ef01abb8db456580d4235d1b7bf63e75d68a08ab'
          log = []
          for name, source, expected in [('baseline',old,0), ('retained',new,0), ('mutant',new.replace('program.to_owned()', '"wrong".to_owned()'),101)]:
              src = directory/(name+'.rs')
              src.write_text(source, encoding='utf-8')
              exe = directory/(name+'.exe')
              subprocess.run(['rustc','--edition=2024','--test',str(src),'-o',str(exe)],check=True)
              result = subprocess.run([str(exe),'--nocapture'],capture_output=True,text=True,encoding='utf-8')
              output = result.stdout + result.stderr
              print(name + ':\n' + output)
              log.append(name+':\n'+output)
              assert result.returncode == expected, (name,result.returncode,expected)
              if name == 'mutant':
                  assert 'left == right' in output
                  assert '1 failed' in output
          log.append('PASS: baseline and retained tests pass; wrong-first-command mutation is rejected by retained test')
          (directory/'results.log').write_text('\n'.join(log),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: process-proof-${{ matrix.os }}
          path: ${{ runner.temp }}/process-proof/results.log
          retention-days: 14

  publish-cleanup:
    needs: process-platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require successful Rust tests and lint from the pinned validation job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/nitoba/pr-tools/actions/jobs/103434306288'
          for attempt in range(90):
              request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  job = json.load(response)
              assert job['run_id'] == 34651449871
              if job['status'] == 'completed':
                  assert job['conclusion'] == 'success', job['conclusion']
                  required = ['Focused Rust tests','Clippy','Full Rust suite','Build all Rust targets','Export exact tested patch and tree']
                  steps = {s['name']:s['conclusion'] for s in job['steps']}
                  assert all(steps.get(name) == 'success' for name in required), steps
                  print('PASS: pinned Linux Rust validation job 103434306288 completed successfully')
                  break
              time.sleep(10)
          else:
              raise SystemExit('Pinned Rust validation job did not finish; no branch will be published')
          PY
      - uses: actions/checkout@v7
        with:
          ref: 2eabd586f880808e766b145b6b76d77e05ece868
      - uses: actions/download-artifact@v4
        with:
          name: rust-cleanup-evidence
          run-id: 34651449871
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/evidence
      - name: Publish only the verified Rust cleanup on a new branch
        run: |
          git switch -c cleanup/rust-low-value-code-20260911
          git apply --check "$RUNNER_TEMP/evidence/rust-cleanup.patch"
          git apply "$RUNNER_TEMP/evidence/rust-cleanup.patch"
          git diff --check
          git diff --exit-code -- .github apps/dart scripts apps/rust/Cargo.lock apps/rust/src/tui
          test "$(git diff --name-only | wc -l)" -eq 7
          git add apps/rust
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/evidence/tested-tree.txt")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(rust): remove redundant helpers and test ceremony'
          git push origin HEAD:refs/heads/cleanup/rust-low-value-code-20260911
          git rev-parse HEAD
          git show --stat --oneline HEAD

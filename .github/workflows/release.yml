name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  rust-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format
        run: cargo fmt --manifest-path crates/prt/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path crates/prt/Cargo.toml --locked --all-targets -- -D clippy::correctness

      - name: Test
        run: cargo test --manifest-path crates/prt/Cargo.toml --locked

  build:
    needs: rust-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            primary_asset: prt-linux-x64
            rust_asset: prt-rust-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            primary_asset: prt-linux-arm64
            rust_asset: prt-rust-linux-arm64
          - os: macos-14
            target: macos-arm64
            primary_asset: prt-macos-arm64
            rust_asset: prt-rust-macos-arm64
          - os: windows-latest
            target: windows-x64
            primary_asset: prt-windows-x64.exe
            rust_asset: prt-rust-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust ${{ matrix.target }}
        shell: bash
        run: ./scripts/build-rust.sh ${{ matrix.target }} --no-verify

      - name: Stage primary Rust artifact
        shell: bash
        run: cp "crates/prt/dist/${{ matrix.rust_asset }}" "crates/prt/dist/${{ matrix.primary_asset }}"

      - name: Upload primary Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.primary_asset }}
          path: crates/prt/dist/${{ matrix.primary_asset }}
          if-no-files-found: error

      - name: Upload Rust compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rust_asset }}
          path: crates/prt/dist/${{ matrix.rust_asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Wait for draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 30); do
            if gh release view "${GITHUB_REF_NAME}" --json body --jq .body > .release-plz-notes.md 2> /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "GitHub Release ${GITHUB_REF_NAME} was not created in time" >&2
          exit 1

      - name: Generate humanized release notes
        env:
          RELEASE_NOTES_API_URL: https://api.groq.com/openai/v1/chat/completions
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          RELEASE_NOTES_MODEL: openai/gpt-oss-120b
          RELEASE_NOTES_REASONING_EFFORT: medium
        run: |
          python scripts/generate-release-notes.py \
            --tag "${GITHUB_REF_NAME}" \
            --fallback .release-plz-notes.md \
            --output .release-notes.md

      - name: Require humanized release notes
        shell: bash
        run: |
          if [[ ! -s .release-notes.md ]]; then
            echo "Humanized release notes were not generated; keeping the release as draft." >&2
            exit 1
          fi

      - name: Update GitHub Release description
        if: ${{ hashFiles('.release-notes.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file .release-notes.md

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 30); do
            if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
              exit 0
            fi
            sleep 2
          done

          echo "GitHub Release ${GITHUB_REF_NAME} was not created in time" >&2
          exit 1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

# git-cliff configuration for pr-tools.
# https://git-cliff.org/docs/configuration

[remote.github]
owner = "nitoba"
repo = "pr-tools"

[changelog]
header = """
# Changelog

Todas as mudanças relevantes do `prt` serão documentadas neste arquivo.

O formato segue [Keep a Changelog](https://keepachangelog.com/pt-BR/1.0.0/),
e as versões seguem [Semantic Versioning](https://semver.org/lang/pt-BR/).
"""

body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}
- {% if commit.breaking %}**[breaking]** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/nitoba/pr-tools/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
topo_order = true
topo_order_commits = true
sort_commits = "newest"

commit_parsers = [
    { message = "^feat", group = "Novidades" },
    { message = "^fix", group = "Correções" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refatorações" },
    { message = "^docs?", group = "Documentação" },
    { message = "^test", group = "Testes" },
    { message = "^(build|ci)", group = "Build e CI" },
    { message = "^chore", group = "Manutenção" },
    { message = "^revert", group = "Revertidos" },
    { message = "^Merge", skip = true },
    { message = ".*", group = "Outras mudanças" },
]
